name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_PYTHON: "3.13"
  # Fail closed if pyproject.toml and the reviewed lockfile diverge. This also
  # prevents later `uv run` commands from silently re-locking in CI.
  UV_LOCKED: "1"
  UV_NO_BUILD_ISOLATION: "1"

jobs:
  format-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Set up Python
      run: uv python install "$PYTHON_VERSION"

    - name: Install dependencies
      run: |
        uv sync --locked --only-group build --no-install-project --no-build
        uv sync --all-extras --dev --locked --no-build-isolation

    - name: Check code formatting with black
      run: uv run --locked black --check --diff .

    - name: Check import sorting with isort
      run: uv run --locked isort --check-only --diff .

    - name: Lint with ruff
      run: uv run --locked ruff check --output-format=github .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Set up Python
      run: uv python install "$PYTHON_VERSION"

    - name: Install dependencies
      run: |
        uv sync --locked --only-group build --no-install-project --no-build
        uv sync --all-extras --dev --locked --no-build-isolation

    - name: Type check with mypy
      run: uv run --locked mypy src --show-error-codes --pretty
