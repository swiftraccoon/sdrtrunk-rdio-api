name: ubuntu-latest

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_LOCKED: "1"
  UV_NO_BUILD_ISOLATION: "1"

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Set up Python ${{ matrix.python-version }}
      env:
        TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      run: uv python install "$TEST_PYTHON_VERSION"

    - name: Install dependencies
      run: |
        uv sync --locked --only-group build --no-install-project --no-build
        uv sync --all-extras --dev --locked --no-build-isolation

    - name: Run tests with coverage
      run: uv run --locked pytest -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
      with:
        files: ./coverage.xml
        version: "v11.3.1"
        flags: linux
        name: linux-py${{ matrix.python-version }}
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Test CLI help
      run: uv run --locked sdrtrunk-rdio-api --help

    - name: Test configuration generation
      run: |
        uv run --locked sdrtrunk-rdio-api init --output test-config.yaml
        if [ ! -f test-config.yaml ]; then
          echo "Config file not generated"
          exit 1
        fi

    - name: Test database operations
      run: |
        uv run --locked python -c 'from src.config import Config; from src.database.connection import DatabaseManager; config = Config.load_from_file("test-config.yaml", require_exists=True); DatabaseManager(config.database).close()'
        uv run --locked sdrtrunk-rdio-api -c test-config.yaml test-db
