version: 2

# Routine tooling updates are reviewed together once a month. Application
# dependencies stay in a separate grouped PR so one broken toolchain bump does
# not block runtime security and compatibility updates.
multi-ecosystem-groups:
  monthly-toolchain:
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    assignees:
      - "swiftraccoon"
    commit-message:
      prefix: "deps(toolchain)"
      include: "scope"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    # Keep the consolidated PR current after other changes land. The exact uv
    # version in pyproject.toml must also be supported by GitHub's hosted updater.
    rebase-strategy: "auto"
    versioning-strategy: "increase-if-necessary"
    groups:
      uv-versions:
        applies-to: "version-updates"
        patterns: ["*"]
      uv-security:
        applies-to: "security-updates"
        patterns: ["*"]
    assignees:
      - "swiftraccoon"
    commit-message:
      prefix: "deps(uv)"
      include: "scope"
    labels:
      - "dependencies"
      - "python:uv"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-toolchain"
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
    assignees:
      - "swiftraccoon"
    labels:
      - "dependencies"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-toolchain"
    cooldown:
      default-days: 7
    groups:
      pre-commit-security:
        applies-to: "security-updates"
        patterns: ["*"]
    assignees:
      - "swiftraccoon"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-toolchain"
    cooldown:
      default-days: 7
    groups:
      container-security:
        applies-to: "security-updates"
        patterns: ["*"]
    assignees:
      - "swiftraccoon"
    labels:
      - "dependencies"
