version: 2
updates:
  # Use GitHub's native uv updater so pyproject.toml and uv.lock are maintained
  # together. CI rejects any proposed update that leaves the lock inconsistent.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "swiftraccoon"
    assignees:
      - "swiftraccoon"
    commit-message:
      prefix: "deps(uv)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "uv"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "swiftraccoon"
    assignees:
      - "swiftraccoon"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Refresh commit-pinned third-party hook repositories independently of the
  # Python tools that are installed from uv.lock.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "swiftraccoon"
    assignees:
      - "swiftraccoon"
    commit-message:
      prefix: "deps(pre-commit)"
      include: "scope"
    labels:
      - "dependencies"
      - "pre-commit"

  # Keep digest-pinned runtime and build images on supported security releases.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "swiftraccoon"
    assignees:
      - "swiftraccoon"
    commit-message:
      prefix: "deps(container)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
