[project]
name = "sdrtrunk-rdio-api"
version = "0.1.0"
description = "API for rdio scanner calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "hypercorn>=0.18.0",
    "h2>=4.4.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    "colorlog>=6.10.1",
    "python-multipart>=0.0.26",
    "slowapi>=0.1.9",
]

[project.scripts]
sdrtrunk-rdio-api = "cli:main_sync"

[build-system]
requires = [
    "editables==0.6",
    "hatchling==1.32.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.6.1.19",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "cli.py"]

[tool.hatch.build.targets.sdist]
# Keep local submodule checkouts, tests, operator configuration, and unrelated
# repository files out of release archives. Metadata files required to build
# the wheel from the sdist are included explicitly.
include = [
    "/src",
    "/cli.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
build = [
    "editables==0.6",
    "hatchling==1.32.0",
]
dev = [
    { include-group = "build" },
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "httpx>=0.28.0",
    "black>=25.1.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "types-pyyaml",
    "isort>=6.0.0",
    "types-requests>=2.32.4.20250611",
    "bandit>=1.8.0",
    "pytest-benchmark>=5.1.0",
    "psutil>=6.1.1",
    "pip-audit>=2.9.0",
    "pip>=26.2",
    "pre-commit>=4.6.2",
    "detect-secrets==1.5.0",
]

[tool.uv]
# Keep local, CI, and container lock semantics on the reviewed uv release.
required-version = "==0.12.7"
# Mirror the PEP 517 backend pins as uv-wide build constraints so isolated
# builds cannot select a different copy of these executable build tools.
build-constraint-dependencies = [
    "editables==0.6",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.6.1.19",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501"]  # Line too long - let black handle it

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
]
