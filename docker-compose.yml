services:
  sdrtrunk-rdio-api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Create config/config.yaml first (run `sdrtrunk-rdio-api init` or
      # copy config/config.example.yaml). Mounting the directory instead
      # of the file avoids Docker creating a directory named config.yaml
      # when the file is missing.
      - ./config:/app/config:ro
      - audio-data:/app/data
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  audio-data:
  logs:
