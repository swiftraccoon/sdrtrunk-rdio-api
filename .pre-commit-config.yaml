# Pre-commit hooks for code quality and security
# Install with: make pre-commit

repos:
  # Use the exact Python tooling and transitive dependencies from uv.lock.
  - repo: local
    hooks:
      - id: black
        name: black (locked project environment)
        entry: uv run --locked black
        language: system
        types: [python]

      - id: isort
        name: isort (locked project environment)
        entry: uv run --locked isort --profile black
        language: system
        types: [python]

      - id: ruff
        name: ruff (locked project environment)
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]

      - id: mypy
        name: mypy (locked project environment)
        entry: uv run --locked mypy
        language: system
        require_serial: true
        files: ^src/
        types: [python]

      - id: bandit
        name: bandit (locked project environment)
        entry: uv run --locked bandit -ll
        language: system
        files: ^(src/|cli\.py$|scripts/)
        exclude: ^tests/
        types: [python]

      - id: detect-secrets
        name: detect-secrets (locked project environment)
        entry: uv run --locked detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]

  # Generic repository hygiene checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0  # pragma: allowlist secret
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0 # v0.49.1  # pragma: allowlist secret
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json", "--fix"]
        language_version: "22.22.2"

# Configuration
minimum_pre_commit_version: "4.6.2"
default_stages: [pre-commit]
fail_fast: false
