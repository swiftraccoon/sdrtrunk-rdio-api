# sdrtrunk-rdio-api Configuration
# Every option shown here is read by the server. Server startup fails until
# at least one API key is configured (unless an unsafe mode is explicitly set).

# API Server Configuration
server:
  # Localhost-only by default. Use a firewall/reverse proxy before widening this.
  host: "127.0.0.1"
  port: 8080
  cors_origins: []
  # Interactive API docs at /docs (disable in production if unwanted)
  enable_docs: true
  debug: false
  # Optional built-in TLS. Configure both or neither.
  # ssl_cert: "/path/to/fullchain.pem"
  # ssl_key: "/path/to/private-key.pem"
  # Absolute per-stream request-body deadline; prevents stalled or trickled
  # HTTP/2 bodies from being kept alive by multiplexed connection traffic.
  read_timeout_seconds: 30

# Database Configuration
database:
  # SQLite database file path (directory is created automatically)
  path: "data/rdio_calls.db"
  # Write-Ahead Logging improves concurrent performance
  enable_wal: true

# API Security Configuration
security:
  # API keys protect uploads, queries, metrics, and stored audio.
  # Keys must be 16-512 characters and each needs a unique, non-secret
  # identifier; generate a long random key value.
  api_keys: []
  # Example:
  # api_keys:
  #   - key: "replace-with-a-long-random-secret"
  #     identifier: "main-scanner"  # Stable, non-secret audit label
  #     description: "Main SDRTrunk node"
  #     allowed_ips: []      # Empty means all IPs allowed
  #     allowed_systems: []  # Empty means all systems allowed

  # Reverse proxy IPs whose X-Forwarded-For header should be trusted.
  # Leave empty unless the server runs behind a proxy you control.
  trusted_proxies: []

  # Unsafe compatibility modes. Leave false unless another trusted layer
  # provides equivalent access control.
  allow_unauthenticated_uploads: false
  allow_unauthenticated_reads: false

  # Rate limiting uses the transport IP, or a safely resolved client IP when
  # the direct peer is listed in trusted_proxies.
  # Defaults are sized so busy trunked systems never lose calls.
  rate_limit:
    enabled: true
    max_requests_per_minute: 600
    max_requests_per_hour: 10000
    max_requests_per_day: 100000

# File Handling Configuration
file_handling:
  # Accepted audio formats (SDRTrunk sends MP3)
  accepted_formats: [".mp3"]

  # File size limits
  max_file_size_mb: 100
  min_file_size_kb: 1
  # Keep this much usable space on every filesystem used by uploads,
  # SQLite, or file logging. Capacity rejection returns HTTP 507.
  minimum_free_space_mb: 256
  # Also preserve filesystem metadata capacity for temp, archive, DB, and logs.
  minimum_free_inodes: 1024
  # Extra headroom protected for bounded SQLite retention/WAL transactions
  maintenance_state_reserve_mb: 32

  # Temporary file storage
  temp_directory: "data/temp"

  # Audio file storage
  storage:
    # Storage strategy: "discard" (metadata only) or "filesystem"
    strategy: "filesystem"
    # For filesystem storage
    directory: "data/audio"
    # Hard cap for all regular files under directory. Each authenticated
    # upload conservatively claims max_file_size_mb until its real size is known.
    max_storage_size_mb: 102400
    # Independent file-count cap protects against tiny-file archive exhaustion.
    max_storage_files: 5000000
    # Organize into YYYY/MM/DD/system subdirectories (UTC dates)
    organize_by_date: true
    # Delete calls (audio + metadata) older than this many days.
    # 0 = keep forever. Enforced by the server periodically and by
    # `sdrtrunk-rdio-api clean`.
    retention_days: 30
    # How often the server runs retention/temp cleanup (0 = disable)
    cleanup_interval_hours: 6

# Data Processing Configuration
processing:
  # "store" saves audio + metadata; "log_only" saves metadata only
  mode: "store"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Log file configuration
  file:
    enabled: true
    path: "logs/rdio_calls_api.log"
    max_size_mb: 20
    backup_count: 5

  # Console logging
  console:
    enabled: true
    colorize: true

# Monitoring Configuration
monitoring:
  # Health check endpoint
  health_check:
    enabled: true
    path: "/health"

  # Metrics endpoint
  metrics:
    enabled: true
    path: "/metrics"
